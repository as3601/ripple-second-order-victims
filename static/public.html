<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ripple · Public alerts</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/static/detailed.css?v=2">
<link rel="stylesheet" href="/static/ops.css?v=2">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true">◎</span>
    <div><strong>Ripple Alerts</strong><span class="tagline">Verified disruptions in the Chandigarh tricity, and what they mean for you</span></div></div>
  <div id="nav"></div>
</header>

<main class="page">
  <div class="sos" aria-label="Emergency numbers">
    <a href="tel:112"><b>112</b><span>All emergencies</span></a>
    <a href="tel:108"><b>108</b><span>Ambulance</span></a>
    <a href="tel:101"><b>101</b><span>Fire</span></a>
    <a href="tel:1077"><b>1077</b><span>Disaster helpline</span></a>
  </div>

  <section class="card myarea" aria-labelledby="myarea-h">
    <h2 id="myarea-h">📍 Is my area affected?</h2>
    <div class="area-pick">
      <label class="field">Where do you live or work?
        <select id="my-zone"><option value="">Choose your area…</option></select></label>
      <button type="button" class="btn" id="locate">📡 Use my location</button>
    </div>
    <div id="answer" aria-live="polite"></div>
  </section>

  <p class="checked" id="checked"></p>

  <div class="split">
    <div>
      <section aria-labelledby="list-h">
        <h2 id="list-h">Incidents in the tricity</h2>
        <div id="list"></div>
        <div id="resolved"></div>
      </section>
      <section id="detail" aria-live="polite"></section>
    </div>
    <div class="sticky-map"><div id="map"></div><div id="map-clear" class="map-clear" hidden>🟢 No active incidents</div></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/static/common.js?v=1"></script>
<script src="/static/public.js?v=2"></script>
</body>
</html>
